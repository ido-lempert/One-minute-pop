<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One Minute Pop</title>
<style>
body{margin:0;font:16px system-ui;background:#10131a;color:#eee;text-align:center;touch-action:manipulation}
#bar{padding:.6rem;display:flex;justify-content:space-around;font-weight:700}
#field{position:relative;width:min(92vw,520px);height:min(70vh,520px);margin:0 auto;background:#1b2030;border-radius:12px;overflow:hidden}
.dot{position:absolute;border-radius:50%;border:0;cursor:pointer;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:#10131acc}
button.go{font:inherit;font-weight:700;padding:.6rem 1.2rem;border-radius:8px;border:0;background:#ffd166;color:#10131a;cursor:pointer}
</style></head><body>
<div id="bar"><span>Time <b id="t">60</b></span><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<div id="field"><div id="msg"><div>Tap the dots. Small ones count more. One minute.</div><button class="go" id="go">Start</button></div></div>
<script>
const $=id=>document.getElementById(id),field=$('field'),msg=$('msg');
let score,time,timers=[],best=+localStorage.getItem('pop-best')||0;$('b').textContent=best;
function spawn(){const size=22+Math.random()*44,d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','dot');
 d.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*(field.clientWidth-size)}px;top:${Math.random()*(field.clientHeight-size)}px;background:hsl(${Math.random()*360},70%,60%)`;
 d.onclick=()=>{score+=Math.round(80/size*3);$('s').textContent=score;d.remove()};field.appendChild(d);setTimeout(()=>d.remove(),1400)}
function end(){timers.forEach(clearInterval);field.querySelectorAll('.dot').forEach(d=>d.remove());
 if(score>best){best=score;localStorage.setItem('pop-best',best);$('b').textContent=best}
 msg.style.display='flex';msg.firstElementChild.textContent=`Time. You scored ${score}.`;$('go').textContent='Play again'}
$('go').onclick=()=>{score=0;time=60;$('s').textContent=0;$('t').textContent=60;msg.style.display='none';
 timers=[setInterval(spawn,450),setInterval(()=>{$('t').textContent=--time;if(time<=0)end()},1000)]};
</script></body></html>
