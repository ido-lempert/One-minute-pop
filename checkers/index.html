<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Checkers</title>
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../js/ui.css"></head><body>
<header><a href="../">&larr; Menu</a><h1>3D Checkers</h1></header>
<div class="player-card opponent"><span class="avatar coral">●</span><div><strong>Coral side</strong><small>Computer or player two</small></div><span class="side-tag">RED</span></div><div id="view"></div><div class="player-card"><span class="avatar ivory">○</span><div><strong>Ivory side</strong><small>Tap a piece, then a highlighted square</small></div><span class="side-tag">WHITE</span></div><div id="status" role="status" aria-live="polite"></div>
<div class="bar"><button id="new">New game</button><select id="mode"><option value="ai">Play computer</option><option value="two">Two players</option></select></div>
<section class="game-notes"><div class="notes-title">PLAN YOUR JUMP</div><p>Captures are mandatory. Chain your jumps and reach the far edge to become a king.</p><div class="notes-chips"><span>↔ Drag to rotate</span><span>● Tap to select</span><span>◉ Green dots = legal moves</span></div></section><script type="module" src="checkers.js"></script></body></html>
